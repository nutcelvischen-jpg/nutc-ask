[build]
  # Skip the build (and its credits) when only knowledge.json or docs changed: the function reads knowledge.json live from GitHub.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)knowledge.json' ':(exclude)*.gs' ':(exclude)README.md'"
  publish = "public"
  functions = "netlify/functions"

[functions]
  included_files = ["knowledge.json"]
